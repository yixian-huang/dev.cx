name: devcx

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devcx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: devcx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcx -d devcx"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ADDR: ":8787"
      DATABASE_URL: postgres://devcx:${POSTGRES_PASSWORD}@postgres:5432/devcx?sslmode=disable
      APP_ENV: prod
      ALLOW_ORIGIN: https://dev.cx
      BASE_URL: https://dev.cx
      TRUSTED_PROXIES: "172.16.0.0/12"
      IMGLI_TOKEN: ${IMGLI_TOKEN:-}
      IMGLI_BASE: ${IMGLI_BASE:-https://img.li}
    ports:
      - "127.0.0.1:8120:8787"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_BASE: http://api:8787
      SITE_ORIGIN: https://dev.cx
    ports:
      - "127.0.0.1:3120:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
