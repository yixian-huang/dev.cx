server {
    listen 80;
    server_name dev.cx;
    location ^~ /.well-known/acme-challenge/ { root /www/acme_challenge; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name dev.cx;
    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/devcx/dev.cx.crt;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/devcx/dev.cx.key;
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location ^~ /api/ { proxy_pass http://127.0.0.1:8120; }
    location / { proxy_pass http://127.0.0.1:3120; }
}
