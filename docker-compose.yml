services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: devcx, POSTGRES_PASSWORD: devcx, POSTGRES_DB: devcx }
    ports: ["5432:5432"]
    volumes: [devcx-pg:/var/lib/postgresql/data]
  db-test:
    image: postgres:16
    environment: { POSTGRES_USER: devcx, POSTGRES_PASSWORD: devcx, POSTGRES_DB: devcx_test }
    ports: ["5433:5432"]
volumes: { devcx-pg: {} }
